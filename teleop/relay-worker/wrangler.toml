name = "pickle-hand-relay"
main = "src/index.js"
compatibility_date = "2024-09-23"

# The Spectacles sender page is served by this same worker at "/", so one
# deploy gives the HTTPS WebXR page + the relay rooms on the same host.
[assets]
directory = "../sender"
binding = "ASSETS"

[[durable_objects.bindings]]
name       = "ROOMS"
class_name = "Room"

[[migrations]]
tag                = "v1"
new_sqlite_classes = ["Room"]
